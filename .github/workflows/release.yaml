on:
  push:
    tags:
      - "core-v*.*.*"

name: Release library

jobs:
  cargo-publish:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get current tag
        id: current_tag
        uses: WyriHaximus/github-action-get-previous-tag@61819f33034117e6c686e6a31dba995a85afc9de # v2.0.0

      - name: Parse tag name
        id: parsing
        run: |
          # Parse tag 'core-vX.Y.Z' into 'vX.Y.Z'.
          TAG='${{ steps.current_tag.outputs.tag }}'
          echo "version=${TAG#core-}" >> $GITHUB_OUTPUT

      - name: Release new version
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.current_tag.outputs.tag }}
          name: Sonic core ${{ steps.parsing.outputs.version }}
          body_path: ${{ github.workspace }}/core/CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
